<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sermon — Audience</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b}iframe{border:0;width:100vw;height:100dvh}</style></head><body><iframe id="deck" src="2_Peter_1_Five_Points.html" title="Audience slides"></iframe><script>const f=document.getElementById('deck');const decks=['2_Peter_1_Five_Points.html','Section_2_Scripture_and_Theses_Preview.html'];let part=0;function command(d){if(d.type==='section'){part=Math.max(0,Math.min(1,d.index));f.src=decks[part]}if(d.type==='move'){f.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key:d.direction>0?'ArrowRight':'ArrowLeft'}))}}const bc=new BroadcastChannel('peter-sermon');bc.onmessage=e=>command(e.data);window.addEventListener('storage',e=>{if(e.key==='sermon-command'&&e.newValue)try{command(JSON.parse(e.newValue))}catch{}});</script></body></html>
